<!DOCTYPE html>
<html>
<head>
  <title>KittyVault Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

  <h1>🐾 KittyVault 🐾</h1>
  <p>Log in to manage your catteries.</p>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">

    <!--
      CSRF token generated by Flask-WTF.

      Prevents attackers from forging authenticated POST requests
      from another website.
    -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <p>Email:</p>
    <input type="text" name="email" />

    <p>Password:</p>
    <input type="password" name="password" />

    <br><br>

    <input type="submit" value="Login" />

  </form>

</div>

</body>
</html>
